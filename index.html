<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h2>Weather map</h2>

        <div>
            <label for="city-name">City name</label>
            <input type="text" id="city-name">
        </div>
        <div>
            <label for="city-id">City ID</label>
            <input type="number" id="city-id">
        </div>


        <div>
            <div>
                <label for="city-name-radio">City name</label>
                <input type="radio" name="choose" id="city-name-radio">
            </div>
            <div>
                <label for="city-id-radio">City ID</label>
                <input type="radio" name="choose" id="city-id-radio">
            </div>
        </div>


        <div>
            <div>
                <label for="temprature" >Temprature</label>
                <input type="text" id="temprature">
            </div>
            <div>
                <label for="wind-speed">Wind speed</label>
                <input type="text" id="wind-speed">
            </div>
            <div>
                <label for="humidity">Humidity</label>
                <input type="text" id="humidity">
            </div>
        </div>

        <div>
            <button type="submit">Weather</button>
            <button type="reset">Cancel</button>
        </div>
    </form>
</body>
</html>
