<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/style.css">
    <script defer src="./src/index.js"></script>
    <title>Document</title>
</head>
<body>
    <form>
        <h2>Weather map</h2>
        <div class="main">
            <div class="main-input">
                <label for="city-name">City name</label>
                <input type="text" id="city-name">
            </div>
            <div class="main-input">
                <label for="city-id">City ID</label>
                <input type="number" id="city-id">
            </div>


        <div class="radio">
            <div>
                <label for="city-name-radio">City name</label>
                <input type="radio" name="choose" id="city-name-radio" checked>
            </div>
            <div>
                <label for="city-id-radio">City ID</label>
                <input type="radio" name="choose" id="city-id-radio">
            </div>
        </div>


        <div class="info">
            <div class="info-item">
                <label for="temprature" >Temprature</label>
                <input type="text" id="temprature">
            </div>
            <div class="info-item">
                <label for="wind-speed">Wind speed</label>
                <input type="text" id="wind-speed">
            </div>
            <div class="info-item">
                <label for="humidity">Humidity</label>
                <input type="text" id="humidity">
            </div>
        </div>

        <div class="buttons">
            <button type="submit" id="weather-btn">Weather</button>
            <button type="reset">Cancel</button>
        </div>
        </div>
        
    </form>
</body>
</html>
